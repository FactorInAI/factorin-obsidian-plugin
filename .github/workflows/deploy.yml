name: Deploy modules and docs to GitHub Pages

on:
  push:
    branches: [feat/fs]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build modules
        run: bun run build

      - name: Sync modules
        run: bun scripts/deploy-modules.ts

      - name: Build docs
        run: bun build:docs

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/dist
